name: tests

on:
  push:
    branches: [main, test-me-*]
    tags: '**'
  schedule:
    - cron: '0 0 * * *'  # Runs at midnight every day
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (${{ matrix.os }}, ${{ matrix.python }})
    timeout-minutes: 10

    strategy:
      max-parallel: 1
      matrix:
        include:
        - os: ubuntu-latest
          python: '3.10'
        - os: ubuntu-latest
          python: '3.11'
        - os: ubuntu-latest
          python: '3.12'
        - os: ubuntu-latest
          python: '3.13'
        - os: ubuntu-latest
          python: '3.14'
    runs-on: ${{ matrix.os }}

    env:
      DIASPORA_SDK_CLIENT_ID: ${{ secrets.DIASPORA_SDK_CLIENT_ID }}
      DIASPORA_SDK_CLIENT_SECRET: ${{ secrets.DIASPORA_SDK_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Get pip cache dir
        id: pip-cache-dir
        run: echo "PIP_CACHE_DIR=$(pip cache dir)" >> $GITHUB_ENV

      - name: Use pip cache
        id: pip-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: tests-${{ matrix.os }}-pip-${{ matrix.python }}-${{ hashFiles('setup.py') }}
          restore-keys: |
            tests-${{ matrix.os }}-pip-${{ matrix.python }}-

      - name: Install Packages
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[test]"

      - name: Run Unit Tests
        run: pytest tests/unit -m "not integration" -vv

      # Runs without the repository's secrets (Dependabot's, forks') can't
      # log in, so they run the unit tests only.
      - name: Run Tests
        if: env.DIASPORA_SDK_CLIENT_ID != ''
        run: pytest tests/unit/test_apis.py -m integration -vv -s --log-cli-level=INFO

      - name: Skip Integration Tests
        if: env.DIASPORA_SDK_CLIENT_ID == ''
        run: echo "::notice::No secrets in this run, so the integration tests were skipped."

      - name: Check the kafka-python extra
        run: |
          python -m pip install -e ".[kafka-python]"
          python -c "from diaspora_event_sdk.sdk.kafka_client import kafka_available, kafka_import_error; assert kafka_available, kafka_import_error"
